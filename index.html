<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsalan Premium Barber</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0b0b0b;
            color: #f5f5f5;
            font-family: 'Cinzel', 'Amiri', serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            padding: 40px 20px;
        }
        h1 {
            color: #d4af37;
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .video-container {
            width: 90%;
            max-width: 600px;
            margin: 30px auto;
            border: 2px solid #d4af37;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
            background: #000;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        .gallery {
            padding: 40px 20px;
        }
        .gallery h2 {
            color: #d4af37;
            font-size: 2rem;
            margin-bottom: 20px;
        }
        .photo-box {
            width: 90%;
            max-width: 400px;
            margin: 20px auto;
            border: 1px solid #d4af37;
            border-radius: 10px;
            overflow: hidden;
            background: #111;
        }
        .photo-box img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <h1>Arsalan</h1>
        <p>Precision grooming. Premium style. Professional barbering in Casablanca.</p>
    </header>

    <div class="video-container">
        <video controls autoplay muted loop playsinline>
            <source src="gemini_generated_video.mp4" type="video/mp4">
            متصفحك لا يدعم عرض الفيديو.
        </video>
    </div>

    <div class="gallery">
        <h2>Gallery</h2>
        <div class="photo-box">
            <img src="B552DA39-9ECA-47...jp" alt="Barber Style">
        </div>
    </div>

</body>
</html>
